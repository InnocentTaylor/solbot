[build]
builder = "NIXPACKS"
buildCommand = "npm install -g pnpm@10 && pnpm install --no-frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/sol-bot run build && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "pnpm --filter @workspace/db run push && node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
NODE_ENV = "production"
